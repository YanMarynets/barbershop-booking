{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container px-5">
    <a class="navbar-brand" href="{% url 'booking:home-page' %}">Barbershop</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
      aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'booking:home-page' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'booking:barber-list' %}">Barbers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'booking:service-list' %}">Services</a>
        </li>
        {% if user.is_authenticated %}
          <li class="nav-item">
            {% if user.role == "C" %}
              <a class="nav-link" href="{% url 'booking:booking-list' %}">My bookings</a>
            {% else %}
              <a class="nav-link" href="{% url 'booking:barber-booking-list' %}">My bookings</a>
            {% endif %}
          </li>
          <li class="nav-item">
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button class="nav-link btn btn-link logout-btn" type="submit">Logout</button>
            </form>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">Login</a>
          </li>
          <li class="nav-item">
            <a  class="nav-link" href="{% url 'booking:register' %}">Register</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
